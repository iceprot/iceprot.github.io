name: Vérifier contenu.json

on:
  push:
    paths: ["contenu.json", "index.html", ".github/scripts/verifier_contenu.py"]
  pull_request:
    paths: ["contenu.json", "index.html", ".github/scripts/verifier_contenu.py"]

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/verifier_contenu.py
